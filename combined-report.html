<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>التقرير الموحد CARS-2 & GARS-3</title>
<style>
@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;background:#e5e7eb;font-family:Tahoma,Arial;color:#17202a}.toolbar{position:sticky;top:0;z-index:10;background:#17202a;padding:10px;text-align:center}.toolbar button{border:0;border-radius:8px;padding:10px 16px;margin:3px;font-weight:bold;cursor:pointer}.primary{background:#f59e0b;color:#fff}.light{background:#fff;color:#17202a}.page{width:210mm;min-height:297mm;margin:12px auto;background:#fff;position:relative;overflow:hidden;page-break-after:always}.page:before{content:"";position:absolute;inset:0;background:url("assets/center-background.jpg") center/cover no-repeat;opacity:.075}.content{position:relative;z-index:1;padding:13mm}.header{display:flex;align-items:center;gap:15px;border-bottom:2px solid #17202a;padding-bottom:9px}.logo{width:70px;height:70px;object-fit:contain}.center{font-weight:800;font-size:20px}.sub{font-size:12px;color:#666;margin-top:4px}h1{text-align:center;font-size:23px;margin:12px 0}h2{font-size:18px;border-right:5px solid #f59e0b;padding-right:8px;margin:15px 0 9px}.meta,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.meta>div,.card,.box{border:1px solid #d8dee3;border-radius:8px;padding:9px;background:#ffffffdf}.label{font-size:11px;color:#666}.value{font-weight:bold;margin-top:3px}.big{text-align:center;font-size:31px;font-weight:800}.muted{color:#666;font-size:11px;line-height:1.7}.bar{height:11px;background:#e5e7eb;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#f59e0b}.score{font-size:20px;font-weight:800}.grid6{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.badge{font-weight:bold}.good{color:#15803d}.warn{color:#b45309}.danger{color:#b91c1c}table{width:100%;border-collapse:collapse;font-size:10.5px}th,td{border:1px solid #cfd5da;padding:5px;vertical-align:top}th{background:#f3f4f6}.footer{position:absolute;bottom:7mm;right:13mm;left:13mm;border-top:1px solid #ccc;padding-top:4px;font-size:9px;color:#666;display:flex;justify-content:space-between}.chart{height:88mm;border:1px solid #ddd;border-radius:8px;padding:6px;background:#fff}.plan td:first-child{font-weight:bold;width:18%}ul{margin:5px 0;padding-right:20px;line-height:1.8;font-size:11px}.note{font-size:10px;line-height:1.8;color:#555}.missing{padding:15px;border:1px dashed #cbd5e1;border-radius:8px;color:#64748b}.signature{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:40px;text-align:center}.signature div{padding-top:35px;border-top:1px solid #777}@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none}}@media(max-width:900px){.page{width:100%;min-height:auto;margin:0}.content{padding:20px}.meta,.cards,.grid6{grid-template-columns:1fr}}
</style></head><body>
<div class="toolbar"><button class="light" onclick="window.print()">طباعة / حفظ PDF</button><button class="primary" onclick="exportWord()">تصدير Word</button><button class="light" onclick="location.href='index.html'">العودة للرئيسية</button><button class="light" onclick="loadReport()">تحديث</button></div><div id="report"></div>
<script>
const names=["السلوكيات النمطية المقيدة","التفاعل الاجتماعي","التواصل الاجتماعي","الاستجابات العاطفية","النمط المعرفي","الكلام غير النمطي"];
const levels=[{min:0,max:13,n:"مؤشرات بسيطة"},{min:14,max:27,n:"مؤشرات متوسطة"},{min:28,max:40,n:"مؤشرات مرتفعة"},{min:41,max:54,n:"مؤشرات شديدة"}];
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function read(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function child(){return read("assessmentData")||{}}
function lvl(s){return levels.find(x=>s>=x.min&&s<=x.max)||levels[0]}
function li(a){return Array.isArray(a)&&a.length?'<ul>'+a.map(x=>'<li>'+esc(typeof x==='string'?x:(x.text||x.recommendation||''))+'</li>').join('')+'</ul>':''}
function gars(){return read('garsReportData')||read('GARS_Result')}
function cars(){return read('CARS_Result')||read('carsResult')}
function scoresG(g){const ds=g&&Array.isArray(g.domains)?g.domains:[];return names.map((_,i)=>Number(ds[i]?.score)||0)}
function drawChart(scores){const c=$("chart");if(!c)return;const x=c.getContext('2d'),W=c.width=c.clientWidth*2,H=c.height=c.clientHeight*2;x.scale(2,2);const w=c.clientWidth,h=c.clientHeight,p={l:40,r:10,t:15,b:48},cw=w-p.l-p.r,ch=h-p.t-p.b;x.clearRect(0,0,w,h);x.strokeStyle='#ccc';for(let v=0;v<=54;v+=9){let y=p.t+ch-v/54*ch;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillStyle='#555';x.font='10px Tahoma';x.fillText(v,8,y+3)}const step=cw/6,bw=step*.55;scores.forEach((s,i)=>{let bh=s/54*ch,x0=p.l+i*step+(step-bw)/2,y=p.t+ch-bh;x.fillStyle='#f59e0b';x.fillRect(x0,y,bw,bh);x.fillStyle='#17202a';x.font='bold 11px Tahoma';x.textAlign='center';x.fillText(s,x0+bw/2,y-5);x.font='10px Tahoma';x.fillText(names[i].slice(0,11)+(names[i].length>11?'…':''),x0+bw/2,h-25)});x.textAlign='start'}
function header(){return `<div class="header"><img class="logo" src="assets/logo.png"><div><div class="center">مركز القمة للتدريب والتأهيل</div><div class="sub">نظام CARS-2 & GARS-3 — تقرير تقييم موحد</div></div></div>`}
function footer(n,t){return `<div class="footer"><span>CARS-2 & GARS-3</span><span>صفحة ${n} من ${t}</span></div>`}
function loadReport(){const c=child(),cr=cars(),gr=gars(),scores=scoresG(gr),gt=scores.reduce((a,b)=>a+b,0),pages=[];const childName=c.childName||cr?.child?.childName||'غير محدد',age=c.age||cr?.child?.age||'',date=c.evaluationDate||cr?.date||new Date().toLocaleDateString('ar-EG'),spec=c.specialistName||cr?.child?.specialistName||'';
pages.push(`<section class="page"><div class="content">${header()}<h1>التقرير الموحد</h1><div class="meta"><div><span class="label">اسم الطفل</span><div class="value">${esc(childName)}</div></div><div><span class="label">العمر</span><div class="value">${esc(age)}</div></div><div><span class="label">الجنس</span><div class="value">${esc(c.gender||'')}</div></div><div><span class="label">رقم الملف</span><div class="value">${esc(c.fileNumber||'')}</div></div><div><span class="label">الأخصائي</span><div class="value">${esc(spec)}</div></div><div><span class="label">تاريخ التقييم</span><div class="value">${esc(date)}</div></div></div><h2>ملخص النتائج</h2><div class="cards"><div class="card"><div class="muted">CARS-2</div><div class="big">${cr?esc(cr.totalScore??0):'—'}</div><div class="muted">${cr?'تم حفظ التقييم':'لم يتم إجراء CARS-2 بعد'}</div></div><div class="card"><div class="muted">GARS-3</div><div class="big">${gr?gt+' / 324':'—'}</div><div class="muted">${gr?'6 مجالات × 54':'لم يتم إجراء GARS-3 بعد'}</div></div></div><h2>بيانات التقييم</h2><div class="box">${esc(c.initialNotes||'لا توجد ملاحظات أولية.')}</div><p class="note">هذا التقرير يجمع نتائج أدوات التقييم الموجودة في البرنامج. لا تُستخدم نتيجة مجال منفردة لتشخيص اضطراب طيف التوحد، ويجب تفسير النتائج ضمن التقييم النمائي والسلوكي والسريري الشامل.</p>${footer(1,4)}</div></section>`);
pages.push(`<section class="page"><div class="content">${header()}<h2>نتيجة CARS-2</h2>${cr?`<div class="card"><div class="big">${esc(cr.totalScore)} <span style="font-size:14px">درجة</span></div><p class="note">التصنيف في نسخة البرنامج الحالية: تتم مراجعة الدرجة وفق دليل التصحيح الرسمي، ولا يتم إنشاء تشخيص آلي.</p></div><h3>ملخص البنود</h3><table><thead><tr><th>البند</th><th>الدرجة</th><th>الملاحظة</th></tr></thead><tbody>${(cr.answers||[]).map((a,i)=>`<tr><td>${i+1} — ${esc(a.title||'')}</td><td>${esc(a.score)}</td><td>${esc(a.note||'')}</td></tr>`).join('')}</tbody></table>`:`<div class="missing">لم يتم حفظ تقييم CARS-2 بعد. يمكنك العودة للرئيسية وإجراء التقييم.</div>`}${footer(2,4)}</div></section>`);
pages.push(`<section class="page"><div class="content">${header()}<h2>نتيجة GARS-3</h2>${gr?`<div class="grid6">${names.map((n,i)=>{let l=lvl(scores[i]);return `<div class="card"><b>${n}</b><div class="score">${scores[i]} / 54</div><div class="bar"><span style="width:${scores[i]/54*100}%"></span></div><div class="badge">${l.n}</div></div>`}).join('')}</div><div class="card" style="margin-top:10px"><b>الإجمالي:</b> ${gt} / 324</div><h2>الرسم البياني</h2><div class="chart"><canvas id="chart"></canvas></div>`:`<div class="missing">لم يتم حفظ تقييم GARS-3 بعد.</div>`}${footer(3,4)}</div></section>`);
let plan=[];if(gr){const ds=gr.domains||[];ds.map((d,i)=>({d,i,s:Number(d.score)||0})).sort((a,b)=>b.s-a.s).forEach(o=>{const d=o.d;const inter=d.interpretation||{};plan.push(`<tr><td>${names[o.i]}</td><td>${o.s>=41?'عالية جدًا':o.s>=28?'عالية':o.s>=14?'متوسطة':'مساندة'}</td><td>${esc(inter.description||d.interpretationDescription||'تنمية المهارات المرتبطة بالمجال وتقليل أثر الصعوبات على الأداء اليومي.')}</td><td>${li(d.recommendations||[])}</td></tr>`)})}pages.push(`<section class="page"><div class="content">${header()}<h2>الخطة العلاجية والتوصيات</h2>${plan.length?`<table class="plan"><thead><tr><th>المجال</th><th>الأولوية</th><th>الهدف/التفسير</th><th>التوصيات</th></tr></thead><tbody>${plan.join('')}</tbody></table>`:'<div class="missing">تظهر الخطة التفصيلية بعد إكمال GARS-3.</div>'}<h2>التوصيات العامة</h2><ul><li>تحديد أهداف فردية قابلة للملاحظة والقياس.</li><li>تعميم المهارات في المنزل والبيئة التعليمية والمجتمع.</li><li>مراجعة الخطة دوريًا وفق بيانات الأداء الفعلية.</li><li>تنسيق استراتيجيات الأسرة والفريق العلاجي والتعليمي.</li></ul><div class="signature"><div>توقيع الأخصائي</div><div>اعتماد المركز</div></div>${footer(4,4)}</div></section>`);$("report").innerHTML=pages.join('');if(gr)drawChart(scores)}
function exportWord(){const html=`<!doctype html><html dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:Tahoma,Arial;direction:rtl}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px}h1,h2{text-align:center}.page{page-break-after:always;min-height:270mm}.page:before{content:'';display:block}</style></head><body>${$("report").innerHTML}</body></html>`;const b=new Blob(['\ufeff',html],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CARS-2_GARS-3_Report.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
loadReport();
</script></body></html>

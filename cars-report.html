<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقرير CARS-2 — مركز القمة</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#e5e7eb;color:#17202a;font-family:Tahoma,Arial,sans-serif;line-height:1.7}
.toolbar{position:sticky;top:0;z-index:20;background:#17202a;padding:9px;text-align:center}
.toolbar button{border:0;border-radius:8px;padding:10px 16px;margin:3px;cursor:pointer;font-weight:700}.primary{background:#f59e0b;color:#fff}.light{background:#fff;color:#17202a}
.page{width:210mm;min-height:297mm;margin:12px auto;background:#fff;position:relative;overflow:hidden;page-break-after:always;box-shadow:0 2px 15px #0002}
.page:before{content:"";position:absolute;inset:0;background:url("assets/center-background.jpg") center/cover no-repeat;opacity:.075}
.content{position:relative;z-index:1;padding:13mm 13mm 18mm}
.header{display:flex;align-items:center;gap:15px;border-bottom:2px solid #17202a;padding-bottom:9px}.logo{width:70px;height:70px;object-fit:contain}.center{font-size:20px;font-weight:800}.sub{font-size:11px;color:#666}
h1{text-align:center;font-size:24px;margin:13px 0 4px}h2{font-size:18px;border-right:5px solid #f59e0b;padding-right:8px;margin:17px 0 9px}h3{font-size:14px;margin:12px 0 7px}
.meta,.summary,.twocol{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.box,.card{border:1px solid #d8dee3;border-radius:9px;padding:10px;background:#ffffffdf}.label{font-size:10px;color:#666}.value{font-weight:700;margin-top:2px}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}.total{text-align:center;font-size:38px;font-weight:900}.classification{text-align:center;font-weight:800;font-size:16px;padding:8px;border-radius:8px;background:#fff7ed;color:#9a3412}
.note{font-size:10.5px;color:#555;line-height:1.9}.muted{font-size:10px;color:#666}
table{width:100%;border-collapse:collapse;font-size:10.5px}th,td{border:1px solid #cfd5da;padding:6px;vertical-align:top}th{background:#f3f4f6}.centered{text-align:center}.score{font-weight:800}.bar{height:10px;background:#e5e7eb;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#f59e0b}
ul{margin:5px 0;padding-right:21px;font-size:10.5px;line-height:1.9}.strength{border-right:4px solid #16a34a}.weakness{border-right:4px solid #dc2626}.recommend{border-right:4px solid #2563eb}.goal{border-right:4px solid #7c3aed}
.plan td:first-child{font-weight:700;width:18%}.footer{position:absolute;bottom:7mm;right:13mm;left:13mm;border-top:1px solid #ccc;padding-top:4px;font-size:9px;color:#666;display:flex;justify-content:space-between}
.signature{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:35px;text-align:center}.signature div{padding-top:35px;border-top:1px solid #777}
.missing{padding:15px;border:1px dashed #cbd5e1;border-radius:8px;color:#64748b}.small{font-size:9.5px}
@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none}}
@media(max-width:900px){.page{width:100%;min-height:auto;margin:0}.meta,.summary,.twocol,.result{grid-template-columns:1fr}.content{padding:20px}}
</style>
</head>
<body>
<div class="toolbar">
<button class="light" onclick="window.print()">طباعة / حفظ PDF</button>
<button class="primary" onclick="exportWord()">تصدير Word</button>
<button class="light" onclick="loadReport()">تحديث</button>
<button class="light" onclick="location.href='combined-report.html'">التقرير الموحد</button>
<button class="light" onclick="location.href='cars.html'">العودة للتقييم</button>
</div>
<div id="report"></div>
<script>
const questionsMeta=[
{id:1,title:'العلاقة بالآخرين (التفاعل الاجتماعي)',strength:'يستفيد من فرص التفاعل المباشر والأنشطة المشتركة.',weak:'صعوبة في بدء التفاعل أو الاستجابة الاجتماعية المناسبة.',recs:['تدريب المبادرة والاستجابة الاجتماعية من خلال مواقف يومية قصيرة.','استخدام اللعب التفاعلي وتبادل الأدوار وتعزيز الاستجابة المناسبة.']},
{id:2,title:'التقليد',strength:'يمكن البناء على قدرته على التعلم بالملاحظة والتقليد عندما تكون الاستجابة مناسبة.',weak:'صعوبة في تقليد الحركات أو الأصوات أو الأفعال.',recs:['استخدام النمذجة والتقليد من السهل إلى الأكثر تعقيدًا.','تعزيز كل محاولة تقليد ناجحة ثم تعميمها في مواقف مختلفة.']},
{id:3,title:'الاستجابة العاطفية',strength:'توجد استجابات انفعالية مناسبة نسبيًا في المواقف التي حصل فيها على درجات منخفضة.',weak:'عدم تناسب شدة أو نوع الاستجابة الانفعالية مع بعض المواقف.',recs:['تعليم تسمية المشاعر وربطها بالمواقف.','استخدام القصص الاجتماعية وتمثيل الأدوار لتدريب الاستجابة المناسبة.']},
{id:4,title:'استخدام الجسد',strength:'استخدام الجسد بصورة أكثر وظيفية في البنود الأقل درجة.',weak:'وجود حركات جسمية غير معتادة أو نمطية قد تؤثر في الأداء.',recs:['تحديد المواقف والوظيفة المحتملة للسلوك قبل التدخل.','توفير بدائل وظيفية وحركية آمنة وتعزيز استخدامها.']},
{id:5,title:'استخدام الأشياء',strength:'وجود قدرة أفضل على الاستخدام الوظيفي للأشياء في البنود الأقل درجة.',weak:'استخدام متكرر أو غير وظيفي للأشياء أو التركيز على أجزائها.',recs:['تدريب الاستخدام الوظيفي من خلال النمذجة والتقليد.','تنويع اللعب والأنشطة وتوسيع طرق استخدام الشيء تدريجيًا.']},
{id:6,title:'التكيف مع التغيير',strength:'تقبل نسبي للتغيير في بعض المواقف الأقل درجة.',weak:'صعوبة في تقبل تغيير الروتين أو طريقة تنفيذ النشاط.',recs:['استخدام جدول بصري وتهيئة مسبقة للتغييرات.','إدخال تغييرات صغيرة ومتدرجة وتعزيز المرونة.']},
{id:7,title:'الاستجابة البصرية',strength:'استجابات بصرية أفضل نسبيًا في المواقف الأقل درجة.',weak:'استجابة بصرية غير معتادة أو صعوبة في استخدام النظر بصورة وظيفية.',recs:['تنظيم البيئة البصرية وتقليل المشتتات عند الحاجة.','تعزيز الانتباه المشترك والتوجه نحو النشاط دون إجبار على التواصل البصري.']},
{id:8,title:'الاستجابة السمعية',strength:'تحمل أو استجابة أفضل لبعض المثيرات السمعية.',weak:'استجابة غير معتادة للأصوات أو صعوبة في تنظيم الانتباه السمعي.',recs:['تحديد الأصوات والمواقف المحفزة.','تقديم المثيرات تدريجيًا واستخدام تعليمات قصيرة ودعم بصري.']},
{id:9,title:'التذوق والشم واللمس',strength:'قدرة أفضل على التعامل مع بعض المثيرات الحسية.',weak:'استجابات حسية غير معتادة في التذوق أو الشم أو اللمس.',recs:['تحديد المثيرات الحسية المرتبطة بالصعوبة.','تنظيم البيئة وتقديم بدائل حسية مناسبة وآمنة حسب الحاجة.']},
{id:10,title:'الخوف أو القلق',strength:'وجود مواقف يمكن فيها تنظيم الخوف أو القلق بصورة أفضل.',weak:'خوف أو قلق زائد أو استجابة أقل من المتوقع لبعض المواقف.',recs:['تحديد المواقف المثيرة للقلق وتوقعها مسبقًا.','استخدام التدرج والقصص الاجتماعية واستراتيجيات التهدئة بدل التجنب الكامل.']},
{id:11,title:'التواصل اللفظي',strength:'استخدام لفظي أكثر فاعلية في البنود الأقل درجة.',weak:'تأخر أو تكرار أو استخدام غير وظيفي للكلام.',recs:['تقييم اللغة الاستقبالية والتعبيرية عند الحاجة.','تدريب الكلام الوظيفي والطلب والتعليق والحوار وتحديد وظيفة التكرار قبل تقليله.']},
{id:12,title:'التواصل غير اللفظي',strength:'استخدام أفضل نسبيًا للإيماءات وتعبيرات الوجه في بعض المواقف.',weak:'صعوبة في استخدام الإيماءات أو تعبيرات الوجه أو الإشارات الاجتماعية.',recs:['تدريب الإشارات والإيماءات والانتباه المشترك.','استخدام النمذجة والوسائل البصرية وتعميم المهارات في مواقف طبيعية.']},
{id:13,title:'مستوى النشاط',strength:'مستوى نشاط أقرب للتنظيم في البنود الأقل درجة.',weak:'فرط نشاط أو خمول يؤثر في المشاركة أو التعلم.',recs:['تنظيم البيئة وجدولة فترات الحركة والراحة.','تقسيم المهام واستخدام تعزيز واضح لزيادة المشاركة المناسبة.']},
{id:14,title:'مستوى التفكير والإدراك',strength:'وجود مهارات إدراكية يمكن البناء عليها في البنود الأقل درجة.',weak:'صعوبات في الفهم أو التركيز أو التعامل مع متطلبات المهمة.',recs:['تبسيط التعليمات وتقسيم المهام إلى خطوات.','استخدام دعم بصري وتكرار وظيفي وتعميم المهارة في أكثر من موقف.']},
{id:15,title:'الانطباع العام (التقييم الكلي)',strength:'يمثل هذا البند الصورة العامة التي لاحظها المقيم، وليس مجالًا علاجيًا منفصلًا.',weak:'يعكس الانطباع العام وجود احتياج واضح للدعم وفق الدرجة المسجلة.',recs:['استخدام نتائج البنود الأخرى لتحديد أهداف التدخل الفعلية.','عدم بناء الخطة العلاجية على هذا البند منفردًا.']}
];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function getData(){return read('CARS_Result')||read('carsResult')}
function getChild(d){return d?.childData||d?.child||read('assessmentData')||{}}
function level(score){if(score>=37)return 'نطاق مرتفع — يحتاج إلى دعم واضح';if(score>=30)return 'نطاق متوسط — يحتاج إلى متابعة وتدخل مناسب';return 'نطاق منخفض نسبيًا — تُفسر النتيجة مع باقي المعلومات'}
function priority(score){return score>=3?'أولوية مرتفعة':score===2?'أولوية متوسطة':'أولوية منخفضة'}
function strengthsWeaknesses(answers){let strengths=[],weak=[];answers.forEach(a=>{const m=questionsMeta.find(x=>x.id===a.id);if(!m)return;if(Number(a.score)<=2)strengths.push({title:m.title,text:m.strength,score:a.score});if(Number(a.score)>=3)weak.push({title:m.title,text:m.weak,score:a.score})});return {strengths,weak}}
function recommendationList(answers){return answers.filter(a=>Number(a.score)>=3).map(a=>{const m=questionsMeta.find(x=>x.id===a.id);return m?{id:a.id,title:m.title,score:a.score,recs:m.recs}:null}).filter(Boolean).sort((a,b)=>b.score-a.score)}
function treatmentPlan(items){if(!items.length)return '<div class="missing">لا توجد بنود ذات أولوية مرتفعة وفق الدرجات المسجلة. يمكن تحديد أهداف إضافية بناءً على الملاحظة السريرية واحتياجات الطفل.</div>';return `<table class="plan"><thead><tr><th>الأولوية</th><th>المجال</th><th>هدف علاجي مقترح</th><th>استراتيجيات</th></tr></thead><tbody>${items.map(x=>`<tr><td>${priority(x.score)}</td><td>${esc(x.title)}</td><td>تنمية المهارة المرتبطة بالمجال وتقليل أثر الصعوبة على التعلم والتفاعل والاستقلالية.</td><td><ul>${x.recs.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></td></tr>`).join('')}</tbody></table>`}
function loadReport(){const d=getData();if(!d){$('report').innerHTML='<section class="page"><div class="content"><div class="missing">لا توجد نتيجة CARS-2 محفوظة.</div></div></section>';return}const c=getChild(d),answers=Array.isArray(d.answers)?d.answers:(d.result?.questions||[]),total=Number(d.totalScore??d.result?.totalScore??answers.reduce((s,a)=>s+Number(a.score||0),0));const sw=strengthsWeaknesses(answers),items=recommendationList(answers),date=d.date||c.evaluationDate||new Date().toLocaleDateString('ar-EG');const pages=[];
const header=`<div class="header"><img class="logo" src="assets/logo.png"><div><div class="center">مركز القمة للتدريب والتأهيل</div><div class="sub">نظام تقييم اضطراب طيف التوحد — CARS-2</div></div></div>`;
pages.push(`<section class="page"><div class="content">${header}<h1>تقرير تقييم CARS-2</h1><div class="meta"><div class="box"><span class="label">اسم الطفل</span><div class="value">${esc(c.childName||'غير محدد')}</div></div><div class="box"><span class="label">العمر</span><div class="value">${esc(c.age||'')}</div></div><div class="box"><span class="label">النوع</span><div class="value">${esc(c.gender||'')}</div></div><div class="box"><span class="label">رقم الملف</span><div class="value">${esc(c.fileNumber||'')}</div></div><div class="box"><span class="label">الأخصائي</span><div class="value">${esc(c.specialistName||'')}</div></div><div class="box"><span class="label">التخصص</span><div class="value">${esc(c.specialization||'')}</div></div><div class="box"><span class="label">تاريخ التقييم</span><div class="value">${esc(date)}</div></div><div class="box"><span class="label">ملاحظات أولية</span><div class="value">${esc(c.initialNotes||'—')}</div></div></div><h2>النتيجة</h2><div class="result"><div class="card"><div class="muted">الدرجة الكلية</div><div class="total">${total}</div><div class="muted">من 60 درجة</div></div><div class="card"><div class="muted">مؤشر النطاق</div><div class="classification">${esc(level(total))}</div><p class="note">هذا عرض برمجي مساعد للنتيجة، ولا يُنشئ تشخيصًا آليًا. يجب الرجوع إلى دليل التصحيح المعتمد والتقييم السريري الشامل.</p></div></div><h2>ملخص أولي</h2><div class="box note">تظهر من الدرجات المسجلة مجالات تحتاج إلى دعم بدرجات متفاوتة. تم استخراج نقاط القوة والاحتياج والتوصيات التالية بصورة آلية من البنود المدخلة، وهي مسودة مساعدة تحتاج إلى مراجعة الأخصائي قبل اعتمادها.</div>${footer(1,5)}</div></section>`);
pages.push(`<section class="page"><div class="content">${header}<h2>تفاصيل بنود CARS-2</h2><table><thead><tr><th>البند</th><th>الدرجة</th><th>مؤشر الأولوية</th><th>الملاحظة</th></tr></thead><tbody>${answers.map(a=>`<tr><td>${a.id} — ${esc(a.title||questionsMeta.find(q=>q.id===a.id)?.title||'')}</td><td class="centered score">${esc(a.score)}</td><td>${esc(priority(Number(a.score)||0))}</td><td>${esc(a.note||'—')}</td></tr>`).join('')}</tbody></table><h2>قراءة المجالات</h2>${answers.map(a=>{const m=questionsMeta.find(q=>q.id===a.id);return `<div class="box" style="margin:6px 0"><b>${a.id}. ${esc(m?.title||a.title||'')}</b><div class="bar"><span style="width:${Math.min(100,(Number(a.score)||0)/4*100)}%"></span></div><div class="muted">الدرجة: ${esc(a.score)} / 4</div></div>`}).join('')}${footer(2,5)}</div></section>`);
pages.push(`<section class="page"><div class="content">${header}<h2>نقاط القوة</h2><div class="twocol">${sw.strengths.length?sw.strengths.map(x=>`<div class="box strength"><b>${esc(x.title)}</b><p class="note">${esc(x.text)}</p><span class="muted">الدرجة المسجلة: ${x.score}/4</span></div>`).join(''):'<div class="missing">لم يتم تحديد نقاط قوة آلية من الدرجات. يراجع الأخصائي الملاحظات المباشرة وأداء الطفل.</div>'}</div><h2>نقاط الضعف / مجالات الاحتياج</h2><div class="twocol">${sw.weak.length?sw.weak.map(x=>`<div class="box weakness"><b>${esc(x.title)}</b><p class="note">${esc(x.text)}</p><span class="muted">الدرجة المسجلة: ${x.score}/4</span></div>`).join(''):'<div class="missing">لا توجد بنود بدرجة 3 أو 4 في البيانات الحالية.</div>'}</div>${footer(3,5)}</div></section>`);
pages.push(`<section class="page"><div class="content">${header}<h2>التوصيات</h2>${items.length?items.map(x=>`<div class="box recommend" style="margin:7px 0"><b>${esc(x.title)} — ${priority(x.score)}</b><ul>${x.recs.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`).join(''):'<div class="missing">لا توجد توصيات آلية إضافية. يمكن إدخال توصيات الأخصائي في الملاحظات.</div>'}<h2>الخطة العلاجية المقترحة</h2>${treatmentPlan(items)}<h2>أهداف متابعة عامة</h2><ul><li>تحويل مجالات الاحتياج إلى أهداف سلوكية قابلة للملاحظة والقياس.</li><li>تحديد خط أساس لكل هدف وتسجيل معدل الأداء أو الاستقلالية.</li><li>تعميم المهارات في المنزل والبيئة التعليمية والمواقف الطبيعية.</li><li>مراجعة الخطة دوريًا وتعديل الأهداف وفق بيانات الأداء.</li><li>التنسيق بين الأسرة والأخصائي والفريق التعليمي والعلاجي.</li></ul>${footer(4,5)}</div></section>`);
pages.push(`<section class="page"><div class="content">${header}<h2>خلاصة التقرير</h2><div class="box goal"><p class="note">تشير نتيجة CARS-2 المسجلة إلى الحاجة إلى قراءة متكاملة للخصائص والسلوكيات التي ظهرت في البنود. تم ترتيب الأولويات في هذا التقرير وفق الدرجات المدخلة، مع اعتبار الدرجة الأعلى مؤشرًا على احتياج أكبر للدعم. لا ينبغي استخدام هذه القراءة البرمجية منفردة لإثبات أو نفي التشخيص.</p></div><h2>ملاحظات الأخصائي</h2><div class="box" style="min-height:55mm">${esc(c.initialNotes||'................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................')}</div><h2>اعتماد التقرير</h2><div class="signature"><div>توقيع الأخصائي</div><div>اعتماد المركز</div></div><p class="note small">هذا التقرير أداة تنظيم وعرض للبيانات التي أدخلها المستخدم، وليس بديلًا عن دليل الأداة أو التقييم السريري الشامل.</p>${footer(5,5)}</div></section>`);
$('report').innerHTML=pages.join('')}
function footer(n,t){return `<div class="footer"><span>CARS-2 — مركز القمة للتدريب والتأهيل</span><span>صفحة ${n} من ${t}</span></div>`}
function exportWord(){const html=`<!doctype html><html dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:Tahoma,Arial;direction:rtl}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;vertical-align:top}h1,h2{text-align:center}.page{page-break-after:always;min-height:270mm}.box{border:1px solid #ddd;padding:8px;margin:5px}ul{line-height:1.8}</style></head><body>${$('report').innerHTML}</body></html>`;const b=new Blob(['\ufeff',html],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CARS-2_Report.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
loadReport();
</script>
</body>
</html>
